# Builds the install/update zip automatically when you publish a GitHub Release.
# You only choose the tag (for example v2.7.1). Version numbers and the update source
# inside the plugin are filled in for you.
name: Build plugin zip

on:
  release:
    types: [published]

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build zip
        env:
          TAG: ${{ github.event.release.tag_name }}
          REPO: ${{ github.repository }}
        run: |
          set -e
          VERSION="${TAG#v}"
          VERSION="${VERSION#V}"
          echo "$VERSION" | grep -Eq '^[0-9]+(\.[0-9]+){1,3}$' || { echo "Tag must look like v2.7.1"; exit 1; }
          mkdir -p build/super-widget
          rsync -a --exclude='.git' --exclude='.github' --exclude='build' ./ build/super-widget/
          cd build/super-widget
          sed -i -E "s/^( \* Version:[[:space:]]+).*/\1${VERSION}/" super-widget.php
          sed -i -E "s/(define\( 'SUPER_WIDGET_VERSION', ')[^']*(' \);)/\1${VERSION}\2/" super-widget.php
          sed -i -E "s#(define\( 'SUPER_WIDGET_UPDATE_SOURCE', ')[^']*(' \);)#\1${REPO}\2#" super-widget.php
          grep -n "Version:\|SUPER_WIDGET_VERSION'\|SUPER_WIDGET_UPDATE_SOURCE'" super-widget.php
          cd ..
          zip -qr ../super-widget.zip super-widget

      - name: Attach zip to the release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.event.release.tag_name }}
        run: gh release upload "$TAG" super-widget.zip --clobber
